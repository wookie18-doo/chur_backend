<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Support · Chur</title>
<link rel="icon" type="image/png" href="/static/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F3EEE4;
    --card: #FFFDF8;
    --ink: #1E2621;
    --muted: #5E655F;
    --line: #E4DCCD;
    --accent: #B0432B;
    --accent-dark: #7C2A18;
    --blue: #2B5A8A;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; min-height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    justify-content: center;
    padding: 60px 24px 48px;
  }

  main.card {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    
  }

  .logo {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    display: block;
    margin: 0 auto 22px;
  }

  .eyebrow {
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 14px;
    text-align: center;
  }

  h1 {
    font-family: 'Young Serif', serif;
    font-weight: 400;
    font-size: 36px;
    line-height: 1.2;
    margin: 0 0 16px;
    text-align: center;
  }

  h2 {
    font-family: 'Young Serif', serif;
    font-weight: 400;
    font-size: 20px;
    margin: 0 0 8px;
  }

  p { color: var(--muted); line-height: 1.65; }

  p.body {
    font-size: 15px;
    max-width: 440px;
    margin: 0 auto 36px;
    text-align: center;
  }

  .tile {
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--card);
    padding: 22px 20px;
  }

  .tile p { font-size: 13.5px; line-height: 1.55; margin: 0; }

  .label {
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px;
  }

  a.btn {
    display: inline-block;
    border: 1px solid var(--accent);
    background: var(--accent);
    border-radius: 999px;
    padding: 14px 28px;
    font-weight: 600;
    font-size: 14.5px;
    color: var(--card);
    text-decoration: none;
    transition: opacity 0.15s ease;
  }

  a.btn:hover { opacity: 0.9; }

  a.btn.secondary {
    background: transparent;
    border-color: var(--line);
    color: var(--ink);
  }

  a.inline-link {
    color: var(--blue);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }

  .footnote {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin: 0;
  }

  .tile { text-align: center; margin-bottom: 22px; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/static/logo.png" alt="Chur" width="72" height="72" />

    <p class="eyebrow">Chur</p>
    <h1>Need a hand?</h1>
    <p class="body">
      A question, a hiccup with the app, or feedback you want us to hear —
      reach out and we'll get back to you.
    </p>

    <div class="tile">
      <p class="label">Support email</p>
      <a class="btn" href="mailto:support@chur.app">support@chur.app</a>
    </div>

    <p class="footnote">We usually reply within a couple of days.</p>
  </main>
</body>
</html>
