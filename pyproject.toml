[project]
name = "chur"
version = "0.1.0"
requires-python = ">=3.14,<4.0"
description = ""
authors = [{ name = "Wookie18 d.o.o." }]
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
maintainers = []
readme = "README.md"
dependencies = [
  "fastapi >=0.122.0",
  "uvicorn[standard] >=0.38.0",
  "bcrypt >=4.2.0",
  "pyjwt >=2.10.0",
  "email-validator >=2.2.0",
  "pydantic >=2.12.5",
  "pydantic-settings >=2.12.0",
  "yarl >=1.22.0",
  "ujson >=5.11.0",
  "sqlmodel >=0.0.29",
  "greenlet >=3.2.0",
  "alembic >=1.17.2",
  "asyncpg >=0.31.0",
  "psycopg[binary] >=3.2.0",
  "redis[hiredis] >=6",
  "httptools >=0.7.1",
  "pymongo >=4.15.4",
  "prometheus-client >=0.23.1",
  "prometheus-fastapi-instrumentator >=7.1.0",
  "loguru >=0.7.3",
  "taskiq >=0.12.0",
  "taskiq-fastapi >=0.3.6",
  "taskiq-redis >=1.1.2",
  "pyzmq >=27.1.0",
  "python-multipart>=0.0.32",
  "pdfplumber>=0.11.10",
  "anyio >=4.11.0",
  "click >=8.1.7",
  "httpx >=0.28.1",
  "pillow-heif>=1.8.1",
  "pillow>=13.0.0",
]

[dependency-groups]
dev = [
  "pytest >=9.0.1",
  "ruff >=0.14.6",
  "mypy >=1.19.0",
  "pre-commit >=4.5.0",
  "pytest-cov >=7.0.0",
  "anyio >=4.11.0",
  "pytest-env >=1.2.0",
  "taskiq[reload] >=0.12.0",
]


[tool.uv]
default-groups = ["dev"]

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = ["app",]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_unused_ignores = false
warn_return_any = false
namespace_packages = true

# Remove this and add `types-redis`
# when the issue https://github.com/python/typeshed/issues/8242 is resolved.
[[tool.mypy.overrides]]
module = [
    'redis.asyncio'
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-p no:unraisableexception"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]
anyio_mode = "auto"
env = [
    "CHUR_ENVIRONMENT=pytest",
    "CHUR_DB_BASE=chur_test",
]

[tool.ruff]
target-version = "py313"
# List of enabled rulsets.
# See https://docs.astral.sh/ruff/rules/ for more information.
lint.select = [ "E",     # Error
    "F",     # Pyflakes
    "W",     # Pycodestyle
    "C90",   # McCabe complexity
    "I",     # Isort
    "N",     # pep8-naming
    "D",     # Pydocstyle
    "ANN",   # Pytype annotations
    "S",     # Bandit
    "B",     # Bugbear
    "C4",    # Comprehensions
    "ISC",   # Implicit string concat
    "PIE",   # Unnecessary code
    "T20",   # Catch prints
    "PYI",   # validate pyi files
    "Q",     # Checks for quotes
    "RSE",   # Checks raise statements
    "RET",   # Checks return statements
    "SLF",   # Self checks
    "SIM",   # Simplificator
    "PTH",   # Pathlib checks
    "ERA",   # Checks for commented out code
    "PL",    # PyLint checks
    "RUF",   # Specific to Ruff checks
	"FA102", # Future annotations
	"UP",	 # Python updates
]
lint.ignore = [
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "B008",    # Do not perform function calls in argument defaults
    "D211",    # No blank lines allowed before class docstring
    "D212",    # Multi-line docstring summary should start at the first line
    "D401",    # First line should be in imperative mood
    "D104",    # Missing docstring in public package
    "D100",    # Missing docstring in public module
    "D202",    # No blank lines allowed after function docstring
    "ANN401",  # typing.Any are disallowed in `**kwargs
    "PLR0913", # Too many arguments for function call
    "D106",    # Missing docstring in public nested class
    "UP043",   # Unnecessary default argument specified (conflicts with mypy).
]
lint.mccabe = { max-complexity = 10 }
exclude = [
    "app/db/sql/migrations",
    ".venv/"
]
line-length = 88

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # Use of assert detected
	"PLC0415", # Import outside toplevel
	"PLR0917", # Too many positional arguments (pytest fixtures are injected positionally)
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "float", "bytes"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "taskiq_dependencies.Depends",
  "taskiq.TaskiqDepends",
  "fastapi.Depends",
  "fastapi.Query",
]

[fastapi-template.options]
project_name = "chur"
api_type = "rest"
enable_redis = "True"
enable_rmq = "None"
ci_type = "none"
enable_migrations = "True"
enable_taskiq = "True"
enable_routers = "None"
enable_kafka = "None"
enable_nats = "None"
enable_loguru = "None"
traefik_labels = "None"
add_dummy = "None"
orm = "sqlmodel"
self_hosted_swagger = "None"
prometheus_enabled = "True"
sentry_enabled = "None"
otlp_enabled = "None"
gunicorn = "None"
add_users = "True"
role_based = "True"
enable_grpc = "None"
cookie_auth = "True"
jwt_auth = "True"
